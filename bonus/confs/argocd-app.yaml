# La "Application" de Argo CD: le dice qué repo vigilar y dónde desplegarlo.
# Argo CD revisa el repo cada 3 minutos; al cambiar v1 <-> v2 allí, actualiza la app en dev.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-playground
  namespace: argocd
spec:
  project: default
  source:
    # (Nacho) Bonus: el repo vive en el GitLab local (lo crea gitlabRepo.sh). Es público,
    # así que Argo CD lo lee por la dirección interna del clúster sin contraseña.
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/nmagro-r-iot-argocd.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
