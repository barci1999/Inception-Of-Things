# Configuración de nginx compartida por las 3 apps.
# "ssi on" permite que el index.html muestre el nombre del pod que responde,
# así se ve que app2 reparte entre sus 3 réplicas.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ssi
data:
  default.conf: |
    server {
        listen 80;
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            ssi   on;
        }
    }
